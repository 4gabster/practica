<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirámide de canicas</title>
</head>
<body>
    <form id="formCanicas">
      <label for="alturaPiramide"
        >Introduce un número do 1 ao 10⁹<input
          type="number"
          id="alturaPiramide"
          min="1"
          max="1000000000000000000"

          required
      /></label>
      <button type="submit">Enviar</button>
    </form>
    <script src="script.js"></script> 
</body>
</html>
